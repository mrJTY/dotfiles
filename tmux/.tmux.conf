# Enable vim mode
set-window-option -g mode-keys vi

# Change leader key to C-w
set-option -g prefix C-w
unbind C-b
bind-key C-w send-prefix

# Vim style copy bindings
bind v copy-mode
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
# Use pbcopy on macOS, xclip on Linux for clipboard integration
bind-key -T copy-mode-vi 'y' if-shell 'command -v pbcopy >/dev/null' \
    "send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Navigate windows with defaults
# next window
bind-key n select-window -n
bind-key p select-window -p

# Use vim bindings to navigate panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split horizontally with /
bind / split-window -h
# Split vertically with -
bind - split-window -v

# By default, 'x' is bound to kill-pane in tmux.
bind x kill-pane
